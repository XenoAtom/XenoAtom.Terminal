name: ci

on:
  push:
    paths-ignore:
    - 'doc/**'
    - 'img/**'
    - 'readme.md'
  pull_request:

jobs:
  build:
    permissions:
      id-token: write # Required by NuGet trusted publishing (GitHub OIDC)
      contents: write # Required to create the GitHub release, tag, release notes and assets
    runs-on: 'ubuntu-latest'
    steps:
      # No NuGet API key: dotnet-releaser exchanges the OIDC token for a short-lived key (nuget.trusted_publishing in src/dotnet-releaser.toml).
      - name: "Build, Test, Pack and Publish"
        uses: xoofx/.github/.github/actions/dotnet-releaser-action@main

      - name: "Run LogTerminal sample (ANSI validation)"
        run: dotnet run --project samples/LogTerminal/LogTerminal.csproj -c Release
